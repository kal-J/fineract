version: "3.8"

services:
  community-app:
    image: openmf/web-app:master
    container_name: mifos-web-app
    restart: always
    environment:
      - FINERACT_API_URLS=https://fineract-api.kwantechug.com
      - FINERACT_API_URL=https://fineract-api.kwantechug.com
      - FINERACT_API_PROVIDER=/fineract-provider/api
      - FINERACT_API_VERSION=/v1
      - FINERACT_PLATFORM_TENANT_IDENTIFIER=default
      - FINERACT_PLATFORM_TENANTS_IDENTIFIER=default,demo
      - MIFOS_DEFAULT_LANGUAGE=en-US
      - MIFOS_SUPPORTED_LANGUAGES=cs-CS,de-DE,en-US,es-MX,fr-FR,it-IT,ko-KO,li-LI,lv-LV,ne-NE,pt-PT,sw-SW
      - MIFOS_PRELOAD_CLIENTS=true
      - MIFOS_DEFAULT_CHAR_DELIMITER=,
      - MIFOS_DISPLAY_TENANT_SELECTOR=true
    ports:
      - 4200:80

  fineract:
    extends:
      file: ./config/docker/compose/fineract.yml
      service: fineract
    ports:
      - "9443:8443"
      - "4080:4080"
      - "9090:9090"
    environment:
      - FINERACT_SERVER_SSL_ENABLED=false
      - FINERACT_MANAGEMENT_TRACIING_ENABLED=false
      - FINERACT_MANAGEMENT_METRICS_DISTRIBUTION_HTTP_SERVER_REQUESTS=false
      - FINERACT_SERVER_PORT=4080
      - FINERACT_EXTERNAL_EVENTS_ENABLED=false
    env_file:
      - ./config/docker/env/fineract.env
      - ./config/docker/env/fineract-common.env
      - ./config/docker/env/fineract-mariadb.env
      #- ./config/docker/env/kafka-client.env
